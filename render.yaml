services:
  - type: web
    name: diarep
    runtime: python
    rootDir: diaagent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: google/gemini-3.1-flash-lite
      - key: POLZA_AI_API_KEY
        sync: false
